version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/nats-io/nats.go.Subscription).Unsubscribe
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable: [gofmt]

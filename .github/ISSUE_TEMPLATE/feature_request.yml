name: Feature request
description: Suggest something natsmin should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that natsmin makes hard or impossible?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? API, UI, or both.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you do this today (nats CLI, scripts, other tools)?

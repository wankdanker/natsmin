version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      nats: { patterns: ["github.com/nats-io/*"] }
      go-deps: { patterns: ["*"], exclude-patterns: ["github.com/nats-io/*"] }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      svelte: { patterns: ["svelte", "svelte-check", "@sveltejs/*", "vite"] }
      ui-deps: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Stay on Node LTS lines; bump the major by hand when the next LTS lands.
      - dependency-name: node
        update-types: [version-update:semver-major]

server_name: nats-3
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
server_tags: ["az:3"]

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 2GB
}

accounts {
  SYS { users [ { user: sys, password: sys } ] }
  APP {
    jetstream: enabled
    users [ { user: app, password: app } ]
  }
}
system_account: SYS

cluster {
  name: demo
  listen: 0.0.0.0:6222
  routes: [ nats://nats-1:6222, nats://nats-2:6222, nats://nats-3:6222 ]
}
